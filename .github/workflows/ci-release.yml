name: CI Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS IPA (no codesign)
        run: flutter build ipa --release --no-codesign

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa

  create_release:
    name: Create GitHub Release and upload assets
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-appbundle
          path: artifacts/android

      - name: Download iOS artifact (may be missing)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-ipa
          path: artifacts/ios

      - name: Determine release tag
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/(.*) ]]; then
            echo "RELEASE_TAG=${BASH_REMATCH[1]}" >> $GITHUB_ENV
            echo "RELEASE_DRAFT=false" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=build-${GITHUB_RUN_ID}" >> $GITHUB_ENV
            echo "RELEASE_DRAFT=true" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: ${{ env.RELEASE_TAG }}
          draft: ${{ env.RELEASE_DRAFT }}
          prerelease: false

      - name: Locate downloaded artifacts
        id: locate_artifacts
        run: |
          ANDROID_FILE=$(find artifacts -type f -name "*.aab" -print -quit || true)
          IOS_FILE=$(find artifacts -type f -name "*.ipa" -print -quit || true)
          echo "ANDROID_FILE=$ANDROID_FILE" >> $GITHUB_ENV
          echo "IOS_FILE=$IOS_FILE" >> $GITHUB_ENV
          echo "Found ANDROID_FILE=$ANDROID_FILE"
          echo "Found IOS_FILE=$IOS_FILE"

      - name: Upload Android AAB to release
        if: env.ANDROID_FILE != ''
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.ANDROID_FILE }}
          asset_name: app-${{ env.RELEASE_TAG }}.aab
          asset_content_type: application/octet-stream

      - name: Upload iOS IPA to release
        if: env.IOS_FILE != ''
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.IOS_FILE }}
          asset_name: ios-${{ env.RELEASE_TAG }}.ipa
          asset_content_type: application/octet-stream
